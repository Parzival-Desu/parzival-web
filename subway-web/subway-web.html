<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Subway Tycoon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-wrapper">
        
        <canvas id="gameCanvas" width="1000" height="750"></canvas>

        <div id="side-panel">
            <div class="panel-header">
                <h1>🚇 Subway Builder</h1>
                <p class="instructions">
                    <strong>Left Click:</strong> New Station ($200)<br>
                    <strong>Drag:</strong> Build Track ($10/unit)
                </p>
            </div>

            <div id="control-panel">
                <button id="toggleDeleteBtn">🚫 Delete Mode (OFF)</button>
            </div>

            <div class="panel-stats">
                <div class="stat-row">
                    <span>💰 Budget</span>
                    <span id="budget" class="highlight-val"></span>
                </div>
                <div class="stat-row">
                    <span>🏙️ Stations</span>
                    <span id="stationCount"></span>
                </div>
                <div class="stat-row">
                    <span>🛤️ Track (km)</span>
                    <span id="trackLength"></span>
                </div>
                <div class="stat-row">
                    <span>🚂 Trains</span>
                    <span id="trainCount"></span>
                </div>
            </div>

            <div class="panel-status">
                <p id="statusMsg">Ready to build.</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>

</body>
</html>
